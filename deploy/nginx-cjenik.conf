server {
    listen 80;
    server_name cjenik.mojshop.hr;
    root /var/www/cjenik;
    index index.html;

    # Interno stanje (povijest cijena) nije javno
    location /.state { deny all; }

    location ~ \.csv$ {
        types { } default_type "text/csv; charset=utf-8";
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/csv text/plain;
}
# SSL: sudo certbot --nginx -d cjenik.mojshop.hr
